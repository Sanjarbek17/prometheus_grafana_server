groups:
  - name: node_exporter_alerts
    rules:
      # Alert for any node exporter target that is down
      - alert: InstanceDown
        expr: up{job="node"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Instance {{ $labels.instance }} is down"
          description: "The Prometheus target {{ $labels.instance }} of job {{ $labels.job }} has been down for more than 1 minute."

      # Alert for high CPU load
      - alert: HostHighCpuLoad
        expr: 100 - (avg by(instance, alias, ip) (rate(node_cpu_seconds_total{mode="idle"}[2m])) * 100) > 85
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host High CPU load (instance {{ $labels.instance }})"
          description: "CPU load on instance {{ $labels.instance }} is above 85% (current value: {{ $value | printf \"%.2f\" }}%)."

      # Alert for out of memory
      - alert: HostOutOfMemory
        expr: 100 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100) > 90
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host Low Memory (instance {{ $labels.instance }})"
          description: "Memory usage on instance {{ $labels.instance }} is above 90% (remaining available memory: {{ $value | printf \"%.2f\" }}%)."

      # Alert for out of disk space
      - alert: HostOutOfDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/rootfs"} * 100) / node_filesystem_size_bytes{mountpoint="/rootfs"} < 10
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host Low Disk Space (instance {{ $labels.instance }})"
          description: "Free disk space on mountpoint {{ $labels.mountpoint }} is below 10% (current value: {{ $value | printf \"%.2f\" }}% remaining)."

      # Alert for high network traffic (combined receive and transmit > 100 MB/s)
      - alert: HostHighNetworkTraffic
        expr: (sum by(instance, alias, ip) (rate(node_network_receive_bytes_total{device!~"lo"}[2m]) + rate(node_network_transmit_bytes_total{device!~"lo"}[2m]))) > 104857600
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Host High Network Traffic (instance {{ $labels.instance }})"
          description: "Combined network traffic (download/upload) on instance {{ $labels.instance }} is above 100 MB/s (current traffic: {{ $value | humanize1024 }}B/s)."
