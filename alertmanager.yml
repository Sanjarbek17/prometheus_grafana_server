global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'telegram'

receivers:
- name: 'telegram'
  telegram_configs:
  - bot_token: '${TELEGRAM_BOT_TOKEN}'
    chat_id: ${TELEGRAM_CHAT_ID}
    parse_mode: 'HTML'
    message: |
      {{ range .Alerts }}
      {{ if eq .Status "firing" }}<b>🚨 ALERT: {{ .Status | toUpper }}</b>{{ else }}<b>✅ RESOLVED: {{ .Status | toUpper }}</b>{{ end }}
      <b>Alert Name:</b> <code>{{ .Labels.alertname }}</code>
      <b>PC / Host:</b> <code>{{ if .Labels.alias }}<b>{{ .Labels.alias }}</b>{{ else }}{{ .Labels.instance }}{{ end }}{{ if .Labels.ip }} (IP: {{ .Labels.ip }}){{ end }}</code>
      <b>Severity:</b> <i>{{ .Labels.severity }}</i>
      
      <b>Summary:</b> {{ .Annotations.summary }}
      <b>Description:</b> {{ .Annotations.description }}
      
      <b>Time:</b> {{ .StartsAt.Format "2006-01-02 15:04:05 UTC" }}
      -------------------------------------
      {{ end }}
