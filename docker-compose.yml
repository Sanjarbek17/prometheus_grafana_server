services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9097:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.tmpl.yml
      - ./alert.rules.yml:/etc/prometheus/alert.rules.yml
      - prometheus_data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -e 's/\$${PC1_TARGET}/'$$PC1_TARGET'/g' \
            -e 's/\$${PC1_ALIAS}/'$$PC1_ALIAS'/g' \
            -e 's/\$${PC1_IP}/'$$PC1_IP'/g' \
            /etc/prometheus/prometheus.tmpl.yml > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus
    environment:
      - PC1_TARGET=${PC1_TARGET:-host.docker.internal:9107}
      - PC1_ALIAS=${PC1_ALIAS:-Main-Server}
      - PC1_IP=${PC1_IP:-127.0.0.1}
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

  node_exporter:
    image: prom/node-exporter:latest
    container_name: node_exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    # 1. Mount the host's core directories into the container as read-only
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    # 2. Tell node_exporter to use those mounted directories, and ignore the docker junk
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)'
      - '--web.listen-address=:9107'

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-8007}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_LOGIN_COOKIE_NAME=grafana_session_${GRAFANA_PORT:-8007}
      - GF_SESSION_COOKIE_NAME=grafana_session_${GRAFANA_PORT:-8007}
    depends_on:
      - prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.tmpl.yml
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed -e 's/\$${TELEGRAM_BOT_TOKEN}/'$$TELEGRAM_BOT_TOKEN'/g' \
            -e 's/\$${TELEGRAM_CHAT_ID}/'$$TELEGRAM_CHAT_ID'/g' \
            /etc/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - TZ=Asia/Tashkent
    restart: unless-stopped

  dcgm-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: dcgm_exporter
    restart: unless-stopped
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${DCGM_EXPORTER_PORT:-9407}:9400"

volumes:
  prometheus_data:
  grafana_data: