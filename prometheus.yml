global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["95.46.181.3:8107"]
    relabel_configs:
      - target_label: instance
        replacement: "node_exporter:9100"

  - job_name: "dcgm"
    static_configs:
      - targets: ["dcgm-exporter:9400"]
