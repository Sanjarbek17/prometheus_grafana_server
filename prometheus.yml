global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: "node"
    static_configs:
      - targets: ["host.docker.internal:9107"]
        labels:
          alias: "Main-Server"
          ip: "127.0.0.1"
      # To monitor additional PCs, list them here with their IP/port, custom aliases, and IPs:
      # - targets: ["192.168.1.50:9107"]
      #   labels:
      #     alias: "Office-Desktop"
      #     ip: "192.168.1.50"
      # - targets: ["192.168.1.60:9107"]
      #   labels:
      #     alias: "Home-Laptop"
      #     ip: "192.168.1.60"
    relabel_configs:
      - target_label: instance
        replacement: "node_exporter:9100"

  - job_name: "dcgm"
    static_configs:
      - targets: ["dcgm-exporter:9400"]
